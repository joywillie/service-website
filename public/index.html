<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Service Platform</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;

font-family:Arial,sans-serif;

background:#f4f7fb;

display:flex;
align-items:center;
justify-content:center;

}


.container{

width:90%;
max-width:450px;

}



.card{

background:white;

padding:30px;

border-radius:18px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}



h1,h2{

text-align:center;

}



.tabs{

display:flex;

gap:10px;

margin-bottom:20px;

}



.tabs button{

flex:1;

}



input,textarea{

width:100%;

padding:12px;

margin:8px 0;

border-radius:8px;

border:1px solid #ccc;

}



button{

padding:12px;

border:none;

border-radius:8px;

background:#0d6efd;

color:white;

cursor:pointer;

}



button:hover{

background:#084298;

}



.hidden{

display:none;

}



.dashboard{

max-width:700px;

width:90%;

}



.box{

background:white;

padding:20px;

margin:15px 0;

border-radius:15px;

box-shadow:0 5px 20px #ddd;

}


.logout{

background:#dc3545;

}


.service{

background:#eef4ff;

padding:15px;

margin:10px;

border-radius:10px;

}


</style>

</head>



<body>



<div class="container">



<!-- AUTH PAGE -->


<div id="authPage" class="card">


<h1>🚀 Service Platform</h1>


<div class="tabs">

<button onclick="showLogin()">
Login
</button>


<button onclick="showRegister()">
Create Account
</button>

</div>




<!-- LOGIN -->

<div id="loginForm">


<h2>Welcome Back</h2>


<input id="logEmail"
placeholder="Email">


<input id="logPassword"
type="password"
placeholder="Password">



<button onclick="login()">

Login

</button>


<p id="logMsg"></p>


</div>







<!-- REGISTER -->


<div id="registerForm" class="hidden">


<h2>Create Account</h2>


<input id="regName"
placeholder="Full Name">


<input id="regEmail"
placeholder="Email">


<input id="regPassword"
type="password"
placeholder="Password">


<button onclick="register()">

Register

</button>


<p id="regMsg"></p>


</div>



</div>









<!-- DASHBOARD -->


<div id="dashboard" class="hidden dashboard">



<div class="box">


<h2>Dashboard</h2>


<p id="welcome"></p>


<button class="logout"
onclick="logout()">

Logout

</button>


</div>






<div class="box">


<h2>Services</h2>


<button onclick="loadServices()">

Load Services

</button>


<div id="services"></div>


</div>







<div class="box">


<h2>Request Service</h2>


<input id="reqName"
placeholder="Name">


<input id="reqService"
placeholder="Service">


<textarea id="reqMessage"
placeholder="Message">

</textarea>


<button onclick="sendRequest()">

Send Request

</button>


<p id="requestMsg"></p>


</div>




</div>





</div>







<script>





function showLogin(){

loginForm.classList.remove("hidden");

registerForm.classList.add("hidden");

}



function showRegister(){

registerForm.classList.remove("hidden");

loginForm.classList.add("hidden");

}





async function register(){


const res = await fetch("/api/auth/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

name:regName.value,

email:regEmail.value,

password:regPassword.value

})

});



const data=await res.json();


regMsg.innerText=data.message;


}








async function login(){



const res = await fetch("/api/auth/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

email:logEmail.value,

password:logPassword.value

})


});



const data=await res.json();




if(res.ok){


localStorage.setItem(
"user",
JSON.stringify(data.user)
);



openDashboard();


}else{


logMsg.innerText=data.message;


}


}









function openDashboard(){


authPage.classList.add("hidden");

dashboard.classList.remove("hidden");


let user =
JSON.parse(localStorage.getItem("user"));



welcome.innerText =
"Welcome "+user.name;


}








function logout(){

localStorage.clear();

location.reload();

}










async function loadServices(){


const res =
await fetch("/api/services");


const data =
await res.json();


let html="";



data.data.forEach(s=>{


html += `

<div class="service">

<h3>${s.name}</h3>

<p>${s.description}</p>

<b>KES ${s.price}</b>

</div>

`;


});



services.innerHTML=html;


}










async function sendRequest(){


const res =
await fetch("/api/requests",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

name:reqName.value,

service:reqService.value,

message:reqMessage.value

})


});



const data =
await res.json();


requestMsg.innerText=data.message;


}







window.onload=function(){


if(localStorage.getItem("user")){

openDashboard();

}


}



</script>



</body>

</html>
