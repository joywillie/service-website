<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #0d6efd;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    button {
      padding: 8px 12px;
      border: none;
      background: #0d6efd;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    input {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
    }
  </style>
</head>

<body>

<header>
  <h1>🚀 Service Website</h1>
  <p>Welcome to your platform</p>
</header>

<div class="container">

  <!-- SERVICES -->
  <div class="card">
    <h2>Services</h2>
    <button onclick="loadServices()">Load Services</button>
    <div id="services"></div>
  </div>

  <!-- REGISTER -->
  <div class="card">
    <h2>Register</h2>
    <input id="name" placeholder="Name" />
    <input id="email" placeholder="Email" />
    <input id="password" placeholder="Password" type="password" />
    <button onclick="register()">Register</button>
    <p id="registerMsg"></p>
  </div>

  <!-- LOGIN -->
  <div class="card">
    <h2>Login</h2>
    <input id="loginEmail" placeholder="Email" />
    <input id="loginPassword" placeholder="Password" type="password" />
    <button onclick="login()">Login</button>
    <p id="loginMsg"></p>
  </div>

</div>

<script>
  // LOAD SERVICES
  async function loadServices() {
    const res = await fetch("/api/services");
    const data = await res.json();

    const container = document.getElementById("services");
    container.innerHTML = "";

    data.data.forEach(service => {
      container.innerHTML += `
        <div class="card">
          <h3>${service.name}</h3>
          <p>${service.description}</p>
          <b>KES ${service.price}</b>
        </div>
      `;
    });
  }

  // REGISTER
  async function register() {
    const res = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      })
    });

    const data = await res.json();
    document.getElementById("registerMsg").innerText = data.message;
  }

  // LOGIN
  async function login() {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("loginEmail").value,
        password: document.getElementById("loginPassword").value
      })
    });

    const data = await res.json();
    document.getElementById("loginMsg").innerText = data.message;
  }
</script>

</body>
</html>
