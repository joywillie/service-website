<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Service Platform</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial, sans-serif;
  background:#f4f7fb;

  display:flex;
  justify-content:center;
  align-items:center;
}


.container{
  width:90%;
  max-width:500px;
}


header{
  position:fixed;
  top:0;
  width:100%;
  background:#0d6efd;
  color:white;
  text-align:center;
  padding:15px;
}


.card{

  background:white;
  padding:25px;
  margin:20px 0;

  border-radius:15px;

  box-shadow:0 8px 25px rgba(0,0,0,0.15);

}


h2{
  text-align:center;
}


input, textarea{

  width:100%;
  padding:12px;
  margin:8px 0;

  border:1px solid #ccc;
  border-radius:8px;

}


button{

  width:100%;
  padding:12px;

  background:#0d6efd;
  color:white;

  border:none;
  border-radius:8px;

  cursor:pointer;

}


button:hover{

 background:#084298;

}


.hidden{
 display:none;
}


.service{

 background:#eef4ff;
 padding:15px;
 margin:10px 0;
 border-radius:10px;

}


.logout{

 background:#dc3545;

}


</style>

</head>


<body>


<header>
<h1>🚀 Service Platform</h1>
</header>



<div class="container">



<!-- LOGIN / REGISTER FIRST -->

<div id="authSection">



<div class="card">

<h2>Register</h2>


<input id="regName" placeholder="Full Name">

<input id="regEmail" placeholder="Email">


<input id="regPassword"
type="password"
placeholder="Password">


<button onclick="register()">
Create Account
</button>


<p id="regMsg"></p>


</div>





<div class="card">

<h2>Login</h2>


<input id="logEmail"
placeholder="Email">


<input id="logPassword"
type="password"
placeholder="Password">


<button onclick="login()">
Login
</button>


<p id="logMsg"></p>


</div>



</div>








<!-- DASHBOARD -->

<div id="dashboard" class="hidden">



<div class="card">

<h2>Dashboard</h2>


<p id="welcome"></p>


<button class="logout"
onclick="logout()">

Logout

</button>


</div>





<div class="card">


<h2>Services</h2>


<button onclick="loadServices()">

View Services

</button>


<div id="services"></div>


</div>






<div class="card">


<h2>Request Service</h2>


<input id="reqName"
placeholder="Your Name">


<input id="reqService"
placeholder="Service Needed">


<textarea id="reqMessage"
placeholder="Message"></textarea>


<button onclick="sendRequest()">

Send Request

</button>


<p id="requestMsg"></p>


</div>



</div>




</div>





<script>


// REGISTER

async function register(){


const res = await fetch("/api/auth/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:regName.value,

email:regEmail.value,

password:regPassword.value

})


});


const data=await res.json();


regMsg.innerText=data.message;


}







// LOGIN

async function login(){


const res = await fetch("/api/auth/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

email:logEmail.value,

password:logPassword.value


})

});



const data=await res.json();



if(res.ok){


localStorage.setItem(
"user",
JSON.stringify(data.user)
);



showDashboard();



}

else{


logMsg.innerText=data.message;


}



}








function showDashboard(){


document
.getElementById("authSection")
.classList.add("hidden");


document
.getElementById("dashboard")
.classList.remove("hidden");



let user =
JSON.parse(localStorage.getItem("user"));



welcome.innerText =
"Welcome "+user.name;



}









function logout(){


localStorage.clear();

location.reload();


}










async function loadServices(){



const res =
await fetch("/api/services");


const data =
await res.json();



let output="";



data.data.forEach(service=>{


output += `

<div class="service">

<h3>${service.name}</h3>

<p>${service.description}</p>

<b>KES ${service.price}</b>

</div>

`;


});



services.innerHTML=output;



}










async function sendRequest(){


const res =
await fetch("/api/requests",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

name:reqName.value,

service:reqService.value,

message:reqMessage.value


})

});



const data=await res.json();


requestMsg.innerText=data.message;



}







// KEEP LOGIN AFTER REFRESH

window.onload=function(){


if(localStorage.getItem("user")){

showDashboard();

}


}



</script>


</body>
</html>
