<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoyTech Services</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* AUTH */
.container{
width:380px;
background:white;
padding:25px;
border-radius:15px;
}

h2{text-align:center;}

.form{display:none;flex-direction:column;}
.form.active{display:flex;}

input{
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
padding:10px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

/* DASHBOARD */
.dashboard{
width:95%;
max-width:1000px;
display:flex;
gap:20px;
}

.sidebar{
width:220px;
background:white;
padding:20px;
border-radius:15px;
}

.sidebar button{
width:100%;
margin:8px 0;
padding:10px;
border:none;
border-radius:6px;
background:#eef4ff;
cursor:pointer;
}

.sidebar button.logout{background:#ffdddd;}

.main{flex:1;}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

.hidden{display:none;}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25d366;
color:white;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
text-decoration:none;
}
</style>

</head>

<body>

<!-- AUTH -->
<div id="auth" class="container">

<form id="login" class="form active">
<h2>Login</h2>
<input placeholder="Email">
<input placeholder="Password">
<button type="button" onclick="login()">Login</button>
<p style="color:#2563eb;cursor:pointer" onclick="showForm('signup')">Create Account</p>
</form>

<form id="signup" class="form">
<h2>Signup</h2>
<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="pass" placeholder="Password">
<input id="confirm" placeholder="Confirm Password">
<button type="button" onclick="signup()">Sign Up</button>
<p id="msg"></p>
</form>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard hidden">

<div class="sidebar">
<h3>🚀 JoyTech</h3>

<button onclick="showPage('home')">Home</button>
<button onclick="showPage('request')">Request</button>
<button onclick="showPage('admin')">Admin</button>

<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="main">

<!-- HOME -->
<div id="homePage" class="card">
<h2>Welcome 👋</h2>
<p>ICT Services System</p>
</div>

<!-- REQUEST -->
<div id="requestPage" class="card hidden">
<h2>Send Request</h2>

<input id="rname" placeholder="Name">
<input id="rservice" placeholder="Service">
<input id="rmsg" placeholder="Message">

<button onclick="sendRequest()">Submit</button>
<p id="result"></p>
</div>

<!-- ADMIN -->
<div id="adminPage" class="card hidden">
<h2>Admin Dashboard</h2>
<div id="adminBox">Loading...</div>
</div>

</div>
</div>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/254745806435" target="_blank">💬</a>

<script>

const API = "YOUR_RENDER_URL"; 
let requests = [];

/* LOGIN */
function login(){
document.getElementById("auth").style.display="none";
document.getElementById("dashboard").classList.remove("hidden");
}

/* SIGNUP */
function signup(){
let msg=document.getElementById("msg");
msg.innerText="Account created 🚀";
}

/* PAGE SWITCH */
function showPage(page){
document.querySelectorAll(".card").forEach(c=>c.classList.add("hidden"));
document.getElementById(page+"Page").classList.remove("hidden");

if(page==="admin"){
loadAdmin();
}
}

/* SEND REQUEST (DATABASE) */
function sendRequest(){

let name=document.getElementById("rname").value;
let service=document.getElementById("rservice").value;
let message=document.getElementById("rmsg").value;

if(!name||!service||!message){
document.getElementById("result").innerText="Fill all fields ❌";
return;
}

fetch(API+"/api/request",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,service,message})
})
.then(res=>res.json())
.then(data=>{
document.getElementById("result").innerText="Saved 🚀";

document.getElementById("rname").value="";
document.getElementById("rservice").value="";
document.getElementById("rmsg").value="";
});
}

/* LOAD ADMIN */
function loadAdmin(){

fetch(API+"/api/requests")
.then(res=>res.json())
.then(data=>{

document.getElementById("adminBox").innerHTML =
data.map((r,i)=>
`#${i+1} ${r.name} - ${r.service} - ${r.message}`
).join("<br>");

});
}

/* LOGOUT */
function logout(){
document.getElementById("auth").style.display="block";
document.getElementById("dashboard").classList.add("hidden");
}

</script>

</body>
</html>
