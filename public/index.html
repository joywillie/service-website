<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise System</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* AUTH */
.container{
width:380px;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h2{
text-align:center;
margin-bottom:15px;
color:#111;
}

.form{
display:none;
flex-direction:column;
margin-top:10px;
}

.form.active{
display:flex;
}

input{
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
outline:none;
}

button.submit{
padding:10px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:5px;
}

button.submit:hover{
background:#1d4ed8;
}

/* DASHBOARD */
.dashboard{
width:95%;
max-width:1100px;
display:flex;
gap:20px;
}

.sidebar{
width:240px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px #ddd;
}

.sidebar h2{
color:#0d6efd;
}

.sidebar button{
margin:10px 0;
width:100%;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#eef4ff;
}

.sidebar button.logout{
background:#ffdddd;
color:red;
}

.main{
flex:1;
}

.card-box{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px #ddd;
margin-bottom:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.stat{
background:#eef4ff;
padding:20px;
border-radius:15px;
text-align:center;
}

.hidden{
display:none;
}

@media(max-width:700px){
.dashboard{flex-direction:column;}
.sidebar{width:100%;}
.stats{grid-template-columns:1fr;}
}
</style>

</head>

<body>

<!-- ================= AUTH ================= -->
<div id="auth" class="container">

<!-- LOGIN -->
<form id="login" class="form active">

<h2>Login</h2>

<input type="email" placeholder="Email" required>
<input type="password" placeholder="Password" required>

<button class="submit" type="button" onclick="login()">Login</button>

<p style="text-align:center;margin-top:10px;cursor:pointer;color:#2563eb"
onclick="showForm('forgot')">
Forgot Password?
</p>

<p style="text-align:center;margin-top:15px;font-size:14px;">
Don't have an account?
<a style="color:#2563eb;cursor:pointer" onclick="showForm('signup')">
Create Account
</a>
</p>

</form>

<!-- SIGNUP (FIXED) -->
<form id="signup" class="form">

<h2>Create Account</h2>

<input id="signupName" type="text" placeholder="Full Name" required>
<input id="signupEmail" type="email" placeholder="Email" required>
<input id="signupPassword" type="password" placeholder="Password" required>
<input id="signupConfirm" type="password" placeholder="Confirm Password" required>

<button class="submit" type="button" onclick="signup()">
Sign Up
</button>

<p id="signupMsg" style="text-align:center;margin-top:10px;"></p>

<p style="text-align:center;margin-top:15px;font-size:14px;">
Already have an account?
<a style="color:#2563eb;cursor:pointer" onclick="showForm('login')">
Login
</a>
</p>

</form>

<!-- FORGOT -->
<form id="forgot" class="form">

<h2>Reset Password</h2>

<input type="email" placeholder="Enter email" required>

<button class="submit" type="button">Send Reset Link</button>

<p style="text-align:center;margin-top:15px;cursor:pointer;color:#2563eb"
onclick="showForm('login')">
Back to Login
</p>

</form>

</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard" class="dashboard hidden">

<div class="sidebar">

<h2>🚀 Service</h2>

<button onclick="showHome()">🏠 Home</button>
<button onclick="loadServices()">🛠 Services</button>
<button onclick="showRequests()">📩 Requests</button>

<button class="logout" onclick="logout()">Logout</button>

</div>

<div class="main">

<div class="card-box">
<h1>Welcome 👋</h1>
<p id="welcomeUser">User</p>
</div>

<div class="stats">
<div class="stat"><h2>3+</h2><p>Services</p></div>
<div class="stat"><h2>24/7</h2><p>Support</p></div>
<div class="stat"><h2>100%</h2><p>Quality</p></div>
</div>

<div class="card-box">
<h2>Available Services</h2>
<div id="serviceList">Click Services</div>
</div>

<div class="card-box">
<h2>Request Service</h2>

<input id="requestName" placeholder="Your name">
<input id="requestService" placeholder="Service needed">
<input id="requestMessage" placeholder="Message">

<button onclick="sendRequest()">Submit Request</button>
<p id="requestResult"></p>
</div>

</div>

</div>

<script>

/* FORM SWITCH */
function showForm(id){
document.querySelectorAll(".form").forEach(f=>f.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* LOGIN */
function login(){
document.getElementById("auth").style.display="none";
document.getElementById("dashboard").classList.remove("hidden");

document.getElementById("welcomeUser").innerText =
"Welcome to your dashboard 🚀";
}

/* FIXED SIGNUP FUNCTION */
function signup(){

let name=document.getElementById("signupName").value;
let email=document.getElementById("signupEmail").value;
let pass=document.getElementById("signupPassword").value;
let confirm=document.getElementById("signupConfirm").value;
let msg=document.getElementById("signupMsg");

if(!name || !email || !pass || !confirm){
msg.style.color="red";
msg.innerText="Please fill all fields";
return;
}

if(pass!==confirm){
msg.style.color="red";
msg.innerText="Passwords do not match";
return;
}

msg.style.color="green";
msg.innerText="Account created successfully 🚀";

setTimeout(()=>{
showForm("login");
msg.innerText="";
},1500);

}

/* LOGOUT */
function logout(){
document.getElementById("auth").style.display="block";
document.getElementById("dashboard").classList.add("hidden");
showForm("login");
}

/* DASHBOARD ACTIONS */
function loadServices(){
document.getElementById("serviceList").innerHTML=
"✔ Web Development<br>✔ System Design<br>✔ IT Support";
}

function showHome(){
document.getElementById("serviceList").innerHTML="Click Services";
}

function showRequests(){
alert("Requests panel coming soon 🚀");
}

function sendRequest(){
document.getElementById("requestResult").innerText=
"Request sent successfully 🚀";
}

</script>

</body>
</html>
