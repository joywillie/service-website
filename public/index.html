<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoyTech Services</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* AUTH */
.container{
width:380px;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h2{text-align:center;margin-bottom:15px;}

.form{
display:none;
flex-direction:column;
margin-top:10px;
}

.form.active{display:flex;}

input{
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
padding:10px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

/* DASHBOARD */
.dashboard{
width:95%;
max-width:1100px;
display:flex;
gap:20px;
}

.sidebar{
width:240px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px #ddd;
}

.sidebar button{
margin:10px 0;
width:100%;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#eef4ff;
}

.sidebar button.logout{background:#ffdddd;color:red;}

.main{flex:1;}

.card-box{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px #ddd;
margin-bottom:20px;
}

.page{display:block;}
.hidden{display:none;}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25d366;
color:white;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
text-decoration:none;
}
</style>

</head>

<body>

<!-- ================= AUTH ================= -->
<div id="auth" class="container">

<!-- LOGIN -->
<form id="login" class="form active">

<h2>Login</h2>

<input placeholder="Email">
<input placeholder="Password">

<button type="button" onclick="login()">Login</button>

<p style="text-align:center;margin-top:10px;cursor:pointer;color:#2563eb"
onclick="showForm('forgot')">Forgot Password?</p>

<p style="text-align:center;margin-top:15px;font-size:14px;">
Don't have account?
<a style="color:#2563eb;cursor:pointer" onclick="showForm('signup')">
Create Account
</a>
</p>

</form>

<!-- SIGNUP -->
<form id="signup" class="form">

<h2>Create Account</h2>

<input id="s1" placeholder="Full Name">
<input id="s2" placeholder="Email">
<input id="s3" placeholder="Password">
<input id="s4" placeholder="Confirm Password">

<button type="button" onclick="signup()">Sign Up</button>

<p id="msg" style="text-align:center;margin-top:10px;"></p>

<p style="text-align:center;margin-top:15px;font-size:14px;">
Already have account?
<a style="color:#2563eb;cursor:pointer" onclick="showForm('login')">
Login
</a>
</p>

</form>

<!-- FORGOT -->
<form id="forgot" class="form">

<h2>Reset Password</h2>

<input placeholder="Enter email">

<button type="button">Send Reset Link</button>

<p style="text-align:center;margin-top:15px;color:#2563eb;cursor:pointer"
onclick="showForm('login')">
Back to Login
</p>

</form>

</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard" class="dashboard hidden">

<div class="sidebar">

<h2>🚀 JoyTech</h2>

<button onclick="showPage('home')">Home</button>
<button onclick="showPage('services')">Services</button>
<button onclick="showPage('requests')">Requests</button>
<button onclick="showPage('admin')">Admin</button>

<button class="logout" onclick="logout()">Logout</button>

</div>

<div class="main">

<div id="homePage" class="page">
<div class="card-box">
<h1>Welcome 👋</h1>
<p>JoyTech Services</p>
</div>
</div>

<div id="servicesPage" class="page hidden">
<div class="card-box">
<h2>Services</h2>
<div id="services"></div>
<button onclick="loadServices()">Load Services</button>
</div>
</div>

<div id="requestsPage" class="page hidden">
<div class="card-box">
<h2>Request Service</h2>

<input id="n" placeholder="Name">
<input id="p" placeholder="Service">
<input id="m" placeholder="Message">

<button onclick="send()">Submit</button>
<p id="r"></p>
</div>
</div>

<div id="adminPage" class="page hidden">
<div class="card-box">
<h2>Admin Dashboard</h2>
<div id="adminBox">No requests</div>
</div>
</div>

</div>
</div>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/254745806435" target="_blank">💬</a>

<script>

let requests=[];

/* FORM SWITCH */
function showForm(id){
document.querySelectorAll(".form").forEach(f=>f.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* LOGIN */
function login(){
document.getElementById("auth").style.display="none";
document.getElementById("dashboard").classList.remove("hidden");
}

/* SIGNUP */
function signup(){
let msg=document.getElementById("msg");
msg.style.color="green";
msg.innerText="Account created successfully 🚀";
setTimeout(()=>showForm("login"),1500);
}

/* LOGOUT */
function logout(){
document.getElementById("auth").style.display="block";
document.getElementById("dashboard").classList.add("hidden");
}

/* PAGE SWITCH */
function showPage(p){
document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));
document.getElementById(p+"Page").classList.remove("hidden");
}

/* SERVICES */
function loadServices(){
document.getElementById("services").innerHTML=
"Web Dev<br>Software Dev<br>Graphic Design<br>KRA<br>HELB<br>CV Writing";
}

/* REQUEST */
function send(){

let name=n.value;
let service=p.value;
let msg=m.value;

if(!name||!service||!msg){
r.innerText="Fill all fields ❌";
return;
}

requests.push({name,service,msg});

r.innerText="Sent 🚀";

renderAdmin();
}

/* ADMIN */
function renderAdmin(){
document.getElementById("adminBox").innerHTML=
requests.map((x,i)=>
`#${i+1} ${x.name} - ${x.service} - ${x.msg}`
).join("<br>");
}

</script>

</body>
</html>
