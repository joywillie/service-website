<!DOCTYPE html>
<html>
<head>

<title>Service Platform</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;

font-family:Arial, Helvetica, sans-serif;

background:linear-gradient(135deg,#0d6efd,#6f42c1);

display:flex;
justify-content:center;
align-items:center;

}



.container{

width:90%;
max-width:420px;

}



.card{

background:white;

padding:35px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.25);

}



.logo{

text-align:center;

font-size:35px;

}



h2{

text-align:center;

}



input{

width:100%;

padding:13px;

margin:10px 0;

border-radius:10px;

border:1px solid #ddd;

}



button{

width:100%;

padding:13px;

border:none;

border-radius:10px;

background:#0d6efd;

color:white;

font-size:16px;

cursor:pointer;

}



button:hover{

background:#084298;

}



.links{

text-align:center;

margin-top:15px;

}



a{

color:#0d6efd;

cursor:pointer;

text-decoration:none;

}



.hidden{

display:none;

}





.dashboard{

width:90%;
max-width:700px;

}


.box{

background:white;

padding:25px;

margin:15px;

border-radius:18px;

}



.logout{

background:#dc3545;

}



.service{

background:#eef4ff;

padding:15px;

margin:10px 0;

border-radius:10px;

}


</style>


</head>


<body>


<div class="container">



<!-- AUTH -->

<div id="auth" class="card">


<div class="logo">
🚀
</div>


<h2 id="title">
Login
</h2>



<!-- LOGIN -->

<div id="login">


<input id="email"
placeholder="Email">


<input id="password"
type="password"
placeholder="Password">


<button onclick="login()">

Login

</button>



<div class="links">

<a onclick="forgot()">
Forgot Password?
</a>

<br><br>


Don't have an account?

<a onclick="showRegister()">
Create Account
</a>


</div>


<p id="msg"></p>


</div>






<!-- REGISTER -->

<div id="register" class="hidden">


<input id="name"
placeholder="Full Name">


<input id="rEmail"
placeholder="Email">


<input id="rPassword"
type="password"
placeholder="Password">


<button onclick="register()">

Create Account

</button>



<div class="links">

Already have account?

<a onclick="showLogin()">
Login
</a>


</div>


<p id="rmsg"></p>


</div>



</div>








<!-- DASHBOARD -->


<div id="dashboard" class="hidden dashboard">


<div class="box">

<h2>
Dashboard
</h2>


<p id="welcome"></p>


<button class="logout"
onclick="logout()">

Logout

</button>


</div>




<div class="box">


<h2>
Services
</h2>


<button onclick="loadServices()">

View Services

</button>


<div id="services"></div>


</div>




<div class="box">


<h2>
Request Service
</h2>


<input id="reqName"
placeholder="Name">


<input id="reqService"
placeholder="Service">


<input id="reqMessage"
placeholder="Message">


<button onclick="sendRequest()">

Send Request

</button>


<p id="request"></p>


</div>


</div>






</div>





<script>



function showRegister(){

login.classList.add("hidden");

register.classList.remove("hidden");

title.innerText="Create Account";


}





function showLogin(){

register.classList.add("hidden");

login.classList.remove("hidden");

title.innerText="Login";


}







async function register(){


let res =
await fetch("/api/auth/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

name:name.value,

email:rEmail.value,

password:rPassword.value

})


});



let data =
await res.json();


rmsg.innerText=data.message;


}









async function login(){



let res =
await fetch("/api/auth/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

email:email.value,

password:password.value

})

});




let data =
await res.json();



if(res.ok){


localStorage.setItem(
"user",
JSON.stringify(data.user)
);



openDashboard();


}else{


msg.innerText=data.message;


}


}









function openDashboard(){


auth.classList.add("hidden");


dashboard.classList.remove("hidden");



let user =
JSON.parse(localStorage.getItem("user"));



welcome.innerText =
"Welcome "+user.name;


}






function logout(){

localStorage.clear();

location.reload();

}







function forgot(){

alert(
"Password reset feature will be connected to email service."
);

}







async function loadServices(){


let res =
await fetch("/api/services");


let data =
await res.json();



let html="";


data.data.forEach(s=>{


html+=`

<div class="service">

<h3>${s.name}</h3>

<p>${s.description}</p>

<b>KES ${s.price}</b>

</div>

`;


});


services.innerHTML=html;


}









async function sendRequest(){


let res =
await fetch("/api/requests",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

name:reqName.value,

service:reqService.value,

message:reqMessage.value

})

});



let data =
await res.json();


request.innerText=data.message;


}








window.onload=()=>{


if(localStorage.getItem("user")){

openDashboard();

}


}


</script>


</body>
</html>
