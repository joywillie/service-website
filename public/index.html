<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoyTech Services</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* AUTH */
.container{
width:380px;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h2{text-align:center;margin-bottom:15px;}

.form{display:none;flex-direction:column;margin-top:10px;}
.form.active{display:flex;}

input{
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button.submit{
padding:10px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button.submit:hover{background:#1d4ed8;}

/* DASHBOARD */
.dashboard{
width:95%;
max-width:1100px;
display:flex;
gap:20px;
}

.sidebar{
width:240px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px #ddd;
}

.sidebar h2{color:#0d6efd;}

.sidebar button{
margin:10px 0;
width:100%;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#eef4ff;
}

.sidebar button.logout{
background:#ffdddd;
color:red;
}

.main{flex:1;}

.card-box{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px #ddd;
margin-bottom:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.stat{
background:#eef4ff;
padding:20px;
border-radius:15px;
text-align:center;
}

.page{display:block;}
.hidden{display:none;}

@media(max-width:700px){
.dashboard{flex-direction:column;}
.sidebar{width:100%;}
.stats{grid-template-columns:1fr;}
}

/* FLOATING WHATSAPP BUTTON */
.whatsapp-float{
position:fixed;
bottom:20px;
right:20px;
background:#25d366;
color:white;
width:55px;
height:55px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
text-decoration:none;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
z-index:1000;
}
</style>

</head>

<body>

<!-- AUTH -->
<div id="auth" class="container">

<form id="login" class="form active">
<h2>Login</h2>
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<button class="submit" type="button" onclick="login()">Login</button>

<p style="text-align:center;margin-top:10px;color:#2563eb;cursor:pointer"
onclick="showForm('forgot')">Forgot Password?</p>

<p style="text-align:center;margin-top:15px;">
Don't have account?
<a style="color:#2563eb;cursor:pointer" onclick="showForm('signup')">Create</a>
</p>
</form>

<form id="signup" class="form">
<h2>Create Account</h2>
<input id="signupName" placeholder="Full Name">
<input id="signupEmail" placeholder="Email">
<input id="signupPassword" placeholder="Password">
<input id="signupConfirm" placeholder="Confirm Password">
<button class="submit" type="button" onclick="signup()">Sign Up</button>
<p id="signupMsg" style="text-align:center;margin-top:10px;"></p>
</form>

<form id="forgot" class="form">
<h2>Reset Password</h2>
<input placeholder="Enter email">
<button class="submit" type="button">Send</button>
<p style="text-align:center;color:#2563eb;cursor:pointer"
onclick="showForm('login')">Back</p>
</form>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard hidden">

<!-- SIDEBAR -->
<div class="sidebar">
<h2>🚀 JoyTech</h2>

<button onclick="showPage('home')">🏠 Home</button>
<button onclick="showPage('services')">🛠 Services</button>
<button onclick="showPage('requests')">📩 Requests</button>
<button onclick="showPage('admin')">📊 Admin</button>

<button class="logout" onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- HOME -->
<div id="homePage" class="page">
<div class="card-box">
<h1>Welcome 👋</h1>
<p>JoyTech ICT Services</p>
</div>
</div>

<!-- SERVICES -->
<div id="servicesPage" class="page hidden">
<div class="card-box">
<h2>Services</h2>
<div id="serviceList">Click load services</div>
<button onclick="loadServices()">Load Services</button>
</div>
</div>

<!-- REQUESTS -->
<div id="requestsPage" class="page hidden">
<div class="card-box">
<h2>Request Service</h2>

<input id="requestName" placeholder="Name">
<input id="requestService" placeholder="Service">
<input id="requestMessage" placeholder="Message">

<button onclick="sendRequest()">Submit</button>
<p id="requestResult"></p>
</div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminPage" class="page hidden">

<div class="card-box">
<h2>📊 Admin Dashboard (Requests)</h2>

<div id="adminList">
No requests yet
</div>

</div>

</div>

</div>
</div>

<!-- WHATSAPP FLOAT BUTTON -->
<a class="whatsapp-float"
href="https://wa.me/254745806435"
target="_blank">
💬
</a>

<script>

/* AUTH */
function showForm(id){
document.querySelectorAll(".form").forEach(f=>f.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function login(){
document.getElementById("auth").style.display="none";
document.getElementById("dashboard").classList.remove("hidden");
}

/* STORAGE FOR REQUESTS */
let requests=[];

/* SIGNUP */
function signup(){

let name=document.getElementById("signupName").value;
let email=document.getElementById("signupEmail").value;
let pass=document.getElementById("signupPassword").value;
let confirm=document.getElementById("signupConfirm").value;
let msg=document.getElementById("signupMsg");

if(!name||!email||!pass||!confirm){
msg.innerText="Fill all fields ❌";
msg.style.color="red";
return;
}

if(pass!==confirm){
msg.innerText="Passwords not matching ❌";
msg.style.color="red";
return;
}

msg.innerText="Account created 🚀";
msg.style.color="green";

setTimeout(()=>showForm('login'),1500);
}

/* LOGOUT */
function logout(){
document.getElementById("auth").style.display="block";
document.getElementById("dashboard").classList.add("hidden");
showForm('login');
}

/* PAGE SWITCH */
function showPage(page){
document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
document.getElementById(page+"Page").classList.remove("hidden");
}

/* SERVICES */
function loadServices(){
document.getElementById("serviceList").innerHTML=`
<ul>
<li>Web Development</li>
<li>Software Development</li>
<li>Graphic Design</li>
<li>KRA Applications</li>
<li>HELB Applications</li>
<li>CV Writing</li>
</ul>
`;
}

/* REQUEST + SAVE */
function sendRequest(){

let name=document.getElementById("requestName").value;
let service=document.getElementById("requestService").value;
let message=document.getElementById("requestMessage").value;

if(!name||!service||!message){
document.getElementById("requestResult").innerText="Fill all fields ❌";
document.getElementById("requestResult").style.color="red";
return;
}

let data = {name,service,message};
requests.push(data);

/* show success */
document.getElementById("requestResult").innerText="Sent 🚀";
document.getElementById("requestResult").style.color="green";

/* clear */
document.getElementById("requestName").value="";
document.getElementById("requestService").value="";
document.getElementById("requestMessage").value="";

/* update admin */
renderAdmin();
}

/* ADMIN VIEW */
function renderAdmin(){

let box=document.getElementById("adminList");

if(requests.length===0){
box.innerHTML="No requests yet";
return;
}

box.innerHTML=requests.map((r,i)=>`
<div style="padding:10px;border:1px solid #ddd;margin:10px 0;border-radius:8px;">
<b>#${i+1}</b><br>
Name: ${r.name}<br>
Service: ${r.service}<br>
Message: ${r.message}
</div>
`).join("");

}

</script>

</body>
</html>
