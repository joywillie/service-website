<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Service Platform</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
height:100vh;

font-family:Arial,sans-serif;

background:linear-gradient(135deg,#0d6efd,#6f42c1);

display:flex;
align-items:center;
justify-content:center;

}


.container{

width:90%;
max-width:430px;

}



.card{

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.25);

}



.logo{

text-align:center;
font-size:45px;

}



h2{

text-align:center;

}



input{

width:100%;

padding:12px;

margin:8px 0;

border-radius:10px;

border:1px solid #ccc;

}



button{

width:100%;

padding:12px;

border:none;

border-radius:10px;

background:#0d6efd;

color:white;

cursor:pointer;

}



button:hover{

background:#084298;

}



.links{

text-align:center;

margin-top:15px;

}



a{

color:#0d6efd;

cursor:pointer;

font-weight:bold;

}



.hidden{

display:none;

}



.dashboard{

width:90%;
max-width:700px;

}



.box{

background:white;

padding:20px;

margin:15px;

border-radius:18px;

}



.logout{

background:#dc3545;

}


.service{

background:#eef4ff;

padding:15px;

border-radius:10px;

margin:10px 0;

}


</style>

</head>



<body>



<div class="container">



<!-- AUTH -->

<div id="authCard" class="card">


<div class="logo">
🚀
</div>


<h2 id="formTitle">
Login
</h2>



<!-- LOGIN -->

<div id="loginForm">


<input id="loginEmail"
placeholder="Email">


<input id="loginPassword"
type="password"
placeholder="Password">


<button onclick="login()">

Login

</button>


<div class="links">

<a href="#" onclick="forgotPassword()">
Forgot Password?
</a>

<br><br>


Don't have account?

<a href="#" onclick="showRegister();return false;">
Create Account
</a>


</div>


<p id="loginMessage"></p>


</div>









<!-- REGISTER -->


<div id="registerForm" class="hidden">


<input id="registerName"
placeholder="Full Name">


<input id="registerEmail"
placeholder="Email">


<input id="registerPassword"
type="password"
placeholder="Password">


<button onclick="registerUser()">

Create Account

</button>



<div class="links">

Already have account?

<a href="#" onclick="showLogin();return false;">
Login
</a>


</div>


<p id="registerMessage"></p>


</div>



</div>








<!-- DASHBOARD -->


<div id="dashboard" class="dashboard hidden">



<div class="box">


<h2>
Dashboard
</h2>


<p id="welcomeUser"></p>


<button class="logout"
onclick="logout()">

Logout

</button>


</div>





<div class="box">


<h2>
Services
</h2>


<button onclick="loadServices()">

View Services

</button>


<div id="serviceList"></div>


</div>






<div class="box">


<h2>
Request Service
</h2>


<input id="requestName"
placeholder="Name">


<input id="requestService"
placeholder="Service">


<input id="requestMessage"
placeholder="Message">


<button onclick="sendRequest()">

Send Request

</button>


<p id="requestResult"></p>


</div>



</div>








</div>






<script>



function showRegister(){


document
.getElementById("loginForm")
.classList.add("hidden");


document
.getElementById("registerForm")
.classList.remove("hidden");


document
.getElementById("formTitle")
.innerText="Create Account";


}







function showLogin(){


document
.getElementById("registerForm")
.classList.add("hidden");


document
.getElementById("loginForm")
.classList.remove("hidden");


document
.getElementById("formTitle")
.innerText="Login";


}








async function registerUser(){


const res =
await fetch("/api/auth/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

name:
document.getElementById("registerName").value,


email:
document.getElementById("registerEmail").value,


password:
document.getElementById("registerPassword").value


})

});



const data =
await res.json();



document.getElementById("registerMessage")
.innerText=data.message;


}









async function login(){



const res =
await fetch("/api/auth/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

email:
document.getElementById("loginEmail").value,


password:
document.getElementById("loginPassword").value


})


});



const data =
await res.json();




if(res.ok){


localStorage.setItem(
"user",
JSON.stringify(data.user)
);



openDashboard();


}

else{


document.getElementById("loginMessage")
.innerText=data.message;


}


}








function openDashboard(){


document
.getElementById("authCard")
.classList.add("hidden");



document
.getElementById("dashboard")
.classList.remove("hidden");



let user =
JSON.parse(localStorage.getItem("user"));



document.getElementById("welcomeUser")
.innerText =
"Welcome "+user.name;


}







function logout(){

localStorage.clear();

location.reload();

}







function forgotPassword(){

alert(
"Password reset will be connected to email verification."
);

}








async function loadServices(){


const res =
await fetch("/api/services");


const data =
await res.json();


let html="";



data.data.forEach(item=>{


html+=`

<div class="service">

<h3>${item.name}</h3>

<p>${item.description}</p>

<b>KES ${item.price}</b>

</div>

`;

});


document.getElementById("serviceList")
.innerHTML=html;


}








async function sendRequest(){


const res =
await fetch("/api/requests",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

name:
requestName.value,


service:
requestService.value,


message:
requestMessage.value


})

});



const data =
await res.json();



requestResult.innerText=data.message;


}








window.onload=function(){


if(localStorage.getItem("user")){

openDashboard();

}


}


</script>


</body>

</html>
