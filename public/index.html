<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Platform</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f5f7fb;
}

header {
  background: #0d6efd;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}

button {
  padding: 10px;
  border: none;
  background: #0d6efd;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}

/* hidden sections */
.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>🚀 Service Platform</h1>
</header>

<div class="container">

<!-- LOGIN / REGISTER (FIRST SCREEN) -->
<div id="authSection">

  <div class="card">
    <h2>Register</h2>
    <input id="regName" placeholder="Name">
    <input id="regEmail" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">
    <button onclick="register()">Register</button>
    <p id="regMsg"></p>
  </div>

  <div class="card">
    <h2>Login</h2>
    <input id="logEmail" placeholder="Email">
    <input id="logPassword" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="logMsg"></p>
  </div>

</div>

<!-- MAIN APP (HIDDEN UNTIL LOGIN) -->
<div id="appSection" class="hidden">

  <div class="card">
    <h2>Welcome</h2>
    <p id="userInfo"></p>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <h2>Services</h2>
    <button onclick="loadServices()">Load Services</button>
    <div id="services"></div>
  </div>

  <div class="card">
    <h2>Request Service</h2>
    <input id="reqName" placeholder="Name">
    <input id="reqService" placeholder="Service">
    <textarea id="reqMsg" placeholder="Message"></textarea>
    <button onclick="sendRequest()">Send</button>
    <p id="reqResponse"></p>
  </div>

</div>

</div>

<script>

let token = null;

// REGISTER
async function register() {
  const res = await fetch("/api/auth/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      name: regName.value,
      email: regEmail.value,
      password: regPassword.value
    })
  });

  const data = await res.json();
  regMsg.innerText = data.message;
}

// LOGIN
async function login() {
  const res = await fetch("/api/auth/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      email: logEmail.value,
      password: logPassword.value
    })
  });

  const data = await res.json();

  if (data.token) {
    token = data.token;

    // save session
    localStorage.setItem("token", token);
    localStorage.setItem("user", JSON.stringify(data.user));

    showApp();
  }

  logMsg.innerText = data.message;
}

// SHOW APP AFTER LOGIN
function showApp() {
  authSection.classList.add("hidden");
  appSection.classList.remove("hidden");

  const user = JSON.parse(localStorage.getItem("user"));
  userInfo.innerText = `Logged in as ${user.name}`;
}

// LOGOUT
function logout() {
  localStorage.clear();
  location.reload();
}

// LOAD SERVICES
async function loadServices() {
  const res = await fetch("/api/services");
  const data = await res.json();

  let html = "";

  data.data.forEach(s => {
    html += `
      <div class="card">
        <h3>${s.name}</h3>
        <p>${s.description}</p>
        <b>KES ${s.price}</b>
      </div>
    `;
  });

  services.innerHTML = html;
}

// SEND REQUEST
async function sendRequest() {
  const res = await fetch("/api/requests", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      name: reqName.value,
      service: reqService.value,
      message: reqMsg.value
    })
  });

  const data = await res.json();
  reqResponse.innerText = data.message;
}

// AUTO LOGIN IF EXISTS
if (localStorage.getItem("token")) {
  token = localStorage.getItem("token");
  showApp();
}

</script>

</body>
</html>
