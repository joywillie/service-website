<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise System</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* AUTH CONTAINER */
.container{
width:380px;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h2{text-align:center;margin-bottom:15px;}

.tabs{
display:flex;
}

.tabs button{
flex:1;
padding:10px;
border:none;
cursor:pointer;
background:#eee;
}

.tabs button.active{
background:#2563eb;
color:white;
}

/* FORMS */
.form{
display:none;
flex-direction:column;
margin-top:15px;
}

.form.active{
display:flex;
}

input{
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button.submit{
padding:10px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

/* DASHBOARD (NEW UPGRADE) */
.dashboard{
width:95%;
max-width:1100px;
display:flex;
gap:20px;
}

.sidebar{
width:240px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px #ddd;
}

.sidebar h2{
color:#0d6efd;
}

.sidebar button{
margin:10px 0;
width:100%;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#eef4ff;
}

.sidebar button.logout{
background:#ffdddd;
color:red;
}

.main{
flex:1;
}

.card-box{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px #ddd;
margin-bottom:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.stat{
background:#eef4ff;
padding:20px;
border-radius:15px;
text-align:center;
}

.hidden{
display:none;
}

/* MOBILE */
@media(max-width:700px){
.dashboard{flex-direction:column;}
.sidebar{width:100%;}
.stats{grid-template-columns:1fr;}
}
</style>

</head>

<body>

<!-- ================= AUTH ================= -->
<div id="auth" class="container">

<h2>Welcome</h2>

<div class="tabs">
<button class="active" onclick="showForm('login')">Login</button>
<button onclick="showForm('signup')">Create</button>
</div>

<!-- LOGIN -->
<form id="login" class="form active">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<button class="submit" type="button" onclick="login()">Login</button>
<p style="text-align:center;margin-top:10px;cursor:pointer;color:#2563eb"
onclick="showForm('forgot')">Forgot Password?</p>
</form>

<!-- SIGNUP -->
<form id="signup" class="form">
<input type="text" placeholder="Full Name">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<input type="password" placeholder="Confirm Password">
<button class="submit" type="button">Create Account</button>
</form>

<!-- FORGOT -->
<form id="forgot" class="form">
<input type="email" placeholder="Enter email">
<button class="submit" type="button">Reset Password</button>
<p style="text-align:center;margin-top:10px;cursor:pointer;color:#2563eb"
onclick="showForm('login')">Back</p>
</form>

</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard" class="dashboard hidden">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>🚀 Service</h2>

<button onclick="showHome()">🏠 Home</button>
<button onclick="loadServices()">🛠 Services</button>
<button onclick="showRequests()">📩 Requests</button>

<button class="logout" onclick="logout()">Logout</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="card-box">
<h1>Welcome 👋</h1>
<p id="welcomeUser">User</p>
</div>

<div class="stats">
<div class="stat"><h2>3+</h2><p>Services</p></div>
<div class="stat"><h2>24/7</h2><p>Support</p></div>
<div class="stat"><h2>100%</h2><p>Quality</p></div>
</div>

<div class="card-box">
<h2>Available Services</h2>
<div id="serviceList">Click Services</div>
</div>

<div class="card-box">
<h2>Request Service</h2>

<input id="requestName" placeholder="Your name">
<input id="requestService" placeholder="Service needed">
<input id="requestMessage" placeholder="Message">

<button onclick="sendRequest()">Submit Request</button>
<p id="requestResult"></p>
</div>

</div>

</div>

<script>
function showForm(id){
document.querySelectorAll(".form").forEach(f=>f.classList.remove("active"));
document.getElementById(id).classList.add("active");

document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
if(id==="login") document.querySelectorAll(".tabs button")[0].classList.add("active");
if(id==="signup") document.querySelectorAll(".tabs button")[1].classList.add("active");
}

/* LOGIN */
function login(){
document.getElementById("auth").style.display="none";
document.getElementById("dashboard").classList.remove("hidden");

document.getElementById("welcomeUser").innerText="Welcome to your dashboard 🚀";
}

/* DASHBOARD FUNCTIONS */
function logout(){
document.getElementById("auth").style.display="block";
document.getElementById("dashboard").classList.add("hidden");
}

function loadServices(){
document.getElementById("serviceList").innerHTML=
"✔ Web Development<br>✔ System Design<br>✔ IT Support";
}

function showRequests(){
alert("Requests panel coming soon 🚀");
}

function showHome(){
document.getElementById("serviceList").innerHTML="Click Services";
}

function sendRequest(){
document.getElementById("requestResult").innerText=
"Request sent successfully 🚀";
}
</script>

</body>
</html>
